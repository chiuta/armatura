#
# Continuous integration for ARMATURA. NOTE: this workflow has never been run. It was written in an
# environment without GitHub Actions, without Windows or macOS and without the wasm32 target, so the first
# real run may need small fixes (action versions, runner images, a missing system package). See
# docs/DEVELOPMENT.md ("Continuous integration").
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # armatura-gpu is outside the default members on purpose (it needs a GPU adapter); the workspace
      # commands below therefore cover core, cli, capi and wasm (host build).
      - name: Tests
        shell: bash
        run: |
          set +e
          cargo test --workspace --exclude armatura-gpu --locked --no-fail-fast 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          # Surface the failing tests as annotations (readable without log access).
          grep -E -A3 '^test .* FAILED|^---- |panicked at|^error(\[|:)' test.log | grep -v '^--$' | head -60 | while IFS= read -r l; do echo "::error title=test-failure::${l:0:900}"; done
          exit $code
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --exclude armatura-gpu --all-targets --locked -- -D warnings

  wasm32:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the wasm module
        run: cargo build --target wasm32-unknown-unknown -p armatura-wasm --locked
      - name: Put the module where the Node test looks for it (it then also runs its real-module part)
        run: cp target/wasm32-unknown-unknown/debug/armatura_wasm.wasm armatura-wasm/armatura_wasm.wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript wrapper tests (host-side mock of the module)
        shell: bash
        run: |
          set +e
          cargo run -q -p armatura-cli --locked -- demo demo-ci.json
          node armatura-wasm/js/test.mjs demo-ci.json 2>&1 | tee js.log
          code=${PIPESTATUS[0]}
          head -30 js.log | while IFS= read -r l; do echo "::error title=js-test::${l:0:900}"; done
          exit $code

  gpu-parity:
    name: gpu parity (${{ matrix.os }}, informational)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GPU parity tests (skip when no adapter is available)
        shell: bash
        run: |
          set +e
          cargo test -p armatura-gpu --locked --no-fail-fast -- --nocapture 2>&1 | tee gpu.log
          code=${PIPESTATUS[0]}
          grep -E -A3 'adapter|FAILED|panicked at|SKIP' gpu.log | grep -v '^--$' | head -60 | while IFS= read -r l; do echo "::warning title=gpu::${l:0:900}"; done
          exit $code

  licences:
    name: cargo-deny and REUSE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-deny
        shell: bash
        run: |
          set +e
          cargo install cargo-deny --locked
          cargo deny check 2>&1 | tee deny.log
          code=${PIPESTATUS[0]}
          grep -E '^(error|warning)' -A4 deny.log | head -60 | while IFS= read -r l; do echo "::error title=deny::${l:0:900}"; done
          exit $code
      - name: REUSE lint
        if: always()
        uses: fsfe/reuse-action@v5
