[package]
name = "osatura-wasm"
version = "0.1.0"
edition = "2021"
description = "OSATURA WebAssembly module: plain extern C ABI (no wasm-bindgen) over osatura-core"
license = "MPL-2.0"

[lib]
name = "osatura_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
osatura-core = { path = "../osatura-core", default-features = false }
