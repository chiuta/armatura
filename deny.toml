# cargo-deny configuration. Run: scripts/licence-audit.sh  (or: cargo deny --all-features check)
# Not legal advice. This file only polices third-party dependencies; the workspace crates themselves are MPL-2.0 (libraries) and AGPL-3.0-or-later (osatura-cli).
[graph]
all-features = true
# The window toolkit (wry / tao) is only a dependency on Windows and macOS (see osatura-gui/Cargo.toml); its Linux-only
# GTK dependencies are therefore not part of what ships. Judge the three platforms that are built.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[licenses]
confidence-threshold = 0.9
# Permissive licences accepted without review.
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "Unlicense", "BSL-1.0",
  "CC0-1.0", "Unicode-3.0", "Unicode-DFS-2016",
]
# Weak copyleft that is accepted ONLY for the named crate (file-level copyleft, MPL-2.0).
# smartstring comes in through rhai, which is behind the `scripting` feature of osatura-core (on by default; `--no-default-features` builds without it).
exceptions = [
  { allow = ["MPL-2.0"], crate = "osatura-core" },
  { allow = ["MPL-2.0"], crate = "osatura-capi" },
  { allow = ["MPL-2.0"], crate = "osatura-wasm" },
  { allow = ["MPL-2.0"], crate = "osatura-gpu" },
  { allow = ["AGPL-3.0-or-later"], crate = "osatura-cli" },
  { allow = ["AGPL-3.0-or-later"], crate = "osatura-gui" },
  # MPL-2.0 (file-level copyleft, compatible with AGPL-3.0-or-later), pulled in by the window app's `dirs` dependency.
  { allow = ["MPL-2.0"], crate = "option-ext" },
  # `smartstring` (via the scripting engine rhai) is licensed MPL-2.0+.
  { allow = ["MPL-2.0"], crate = "smartstring" },
]
# Anything else (GPL, LGPL, AGPL, EUPL, ...) is denied by default because it is not in `allow`.

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# RUSTSEC-2026-0249: `smartstring` is unmaintained (repository archived 2026-05-03); it is a dependency of
# `rhai`, the optional scripting engine (cargo feature `scripting`, default-on, can be disabled). It is a
# maintenance notice, not a vulnerability. Revisit when rhai drops it or when the scripting feature is replaced.
# RUSTSEC-2024-0370: `proc-macro-error` is unmaintained; it is a build-time proc-macro dependency of the window
# toolkit stack (wry / tao), not a vulnerability and not linked into the binaries. Revisit on toolkit upgrades.
ignore = ["RUSTSEC-2026-0249", "RUSTSEC-2024-0370"]
