# cargo-deny configuration. Run: scripts/licence-audit.sh  (or: cargo deny --all-features check)
# Not legal advice. This file only polices third-party dependencies; the workspace crates themselves are MPL-2.0 (libraries) and AGPL-3.0-or-later (armatura-cli).
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
# Permissive licences accepted without review.
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "Unlicense", "BSL-1.0",
  "CC0-1.0", "Unicode-3.0", "Unicode-DFS-2016",
]
# Weak copyleft that is accepted ONLY for the named crate (file-level copyleft, MPL-2.0).
# smartstring comes in through rhai, which is behind the `scripting` feature of armatura-core (on by default; `--no-default-features` builds without it).
exceptions = [
  { allow = ["MPL-2.0"], crate = "armatura-core" },
  { allow = ["MPL-2.0"], crate = "armatura-capi" },
  { allow = ["MPL-2.0"], crate = "armatura-wasm" },
  { allow = ["MPL-2.0"], crate = "armatura-gpu" },
  { allow = ["AGPL-3.0-or-later"], crate = "armatura-cli" },
  { allow = ["MPL-2.0"], crate = "smartstring" },
]
# Anything else (GPL, LGPL, AGPL, EUPL, ...) is denied by default because it is not in `allow`.

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
