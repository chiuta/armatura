[package]
name = "osatura-gui"
version = "0.1.0"
edition = "2021"
description = "OSATURA Studio as a native window (WebView2 on Windows, WKWebView on macOS); starts the osatura studio server and shows it"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "osatura-studio"
path = "src/main.rs"

# The window toolkit is only built where a native web view exists without extra system packages.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = "0.37"
wry = "0.57"
# Native "Save as" dialog and message box for exports from the window (download handler of the web view).
rfd = { version = "0.17", default-features = false }
