# SPDX-License-Identifier: CC0-1.0
# REUSE (https://reuse.software) annotations for files that cannot carry an SPDX header or are not source code.
# Source files (.rs .js .mjs .sh) carry their own SPDX line; armatura-cli/tests/spdx_audit.rs checks that each
# equals its crate's Cargo `license`. Not legal advice.
version = 1
SPDX-PackageName = "ARMATURA"
SPDX-PackageSupplier = "Alexandru-Ionuț Chiuță (Alexio)"

# --- armatura-cli (AGPL-3.0-or-later): studio page, Cargo manifest ---
[[annotations]]
path = ["armatura-cli/src/studio.html", "armatura-cli/Cargo.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alexandru-Ionuț Chiuță (Alexio)"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# --- libraries (MPL-2.0): C header and smoke test, WGSL shaders, wasm demo page, API surface listing, manifests ---
[[annotations]]
path = [
  "armatura-capi/armatura.h", "armatura-capi/tests/smoke.c", "armatura-capi/Cargo.toml",
  "armatura-gpu/src/wgsl/*.wgsl", "armatura-gpu/Cargo.toml",
  "armatura-wasm/index.html", "armatura-wasm/Cargo.toml",
  "armatura-core/src/api_surface.txt", "armatura-core/Cargo.toml",
  "Cargo.toml", "Cargo.lock", "deny.toml", ".github/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alexandru-Ionuț Chiuță (Alexio)"
SPDX-License-Identifier = "MPL-2.0"

# --- bundled face-detector model: CC-BY-4.0. Trained ONLY on faces generated by this project's own synthetic
#     face generator (facegen.rs); no photographs, no third-party datasets, no third-party pre-trained weights. ---
[[annotations]]
path = "armatura-core/models/face23_synth.bin"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alexandru-Ionuț Chiuță (Alexio)"
SPDX-License-Identifier = "CC-BY-4.0"

# --- documentation: text CC-BY-4.0; code samples inside docs/ are MPL-2.0 ---
[[annotations]]
path = [
  "README.md", "CLEANROOM.md", "CONTRIBUTING.md", "FEATURES.md", "LICENSING.md", "ROADMAP.md", "TRADEMARK.md",
  "LICENSE", "docs/THIRD_PARTY.md", "docs/PATENT_NOTES.md", "out/**",
  "README.ro.md", "CHANGELOG.md", "docs/GETTING_STARTED.md", "docs/CLI_REFERENCE.md", "docs/EXPORT_FORMATS.md",
  "docs/PROJECT_FORMAT.md", "docs/ARCHITECTURE.md", "docs/GLOSSARY.md", "docs/RIGGING_GUIDE.md", "docs/ANIMATION_GUIDE.md",
  "docs/STUDIO.md", "docs/FAQ.md", "docs/C_ABI.md", "docs/WASM.md", "docs/DEVELOPMENT.md", "docs/SECURITY.md",
  ".gitignore", "docs/LIMITATIONS.md", "docs/INDEX.md", "docs/RELEASE_CHECKLIST.md", "docs/img/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alexandru-Ionuț Chiuță (Alexio)"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["docs/API.md", "docs/CI.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alexandru-Ionuț Chiuță (Alexio)"
SPDX-License-Identifier = "CC-BY-4.0 AND MPL-2.0"

# --- third-party licence texts reproduced verbatim: each keeps its own author's licence ---
[[annotations]]
path = "docs/THIRD_PARTY_NOTICES.md"
precedence = "override"
SPDX-FileCopyrightText = "the respective crate authors"
SPDX-License-Identifier = "LicenseRef-third-party"
