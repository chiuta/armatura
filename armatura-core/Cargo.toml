[package]
name = "armatura-core"
version = "0.1.0"
edition = "2021"
description = "Independently implemented 2D vector rigging and animation core (from public specifications and papers; no third-party source copied)"
license = "MPL-2.0"

[dependencies]
gif = "0.14.2"
hound = "3.5.1"
i_overlay = "9.1.0"
jpeg-decoder = { version = "0.3.2", default-features = false }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tiny-skia = "0.12.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# rhai pulls smartstring (MPL-2.0+, file-level copyleft). Optional so a build without scripting has no MPL crate (see docs/THIRD_PARTY.md).
rhai = { version = "1", default-features = false, features = ["no_module"], optional = true }

[features]
default = ["scripting"]
scripting = ["dep:rhai"]
