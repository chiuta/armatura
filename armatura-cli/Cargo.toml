[package]
name = "armatura-cli"
version = "0.1.0"
edition = "2021"
description = "ARMATURA command-line tools and web studio (independently implemented; AGPL-3.0-or-later)"
license = "AGPL-3.0-or-later"

[[bin]]
name = "armatura"
path = "src/main.rs"

[dependencies]
armatura-core = { path = "../armatura-core", default-features = false }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = "1"
tiny-skia = "0.12"
armatura-gpu = { path = "../armatura-gpu", optional = true }

[features]
default = ["scripting"]
# Rhai scripting command (pulls the MPL-2.0+ crate smartstring). `--no-default-features` builds without it.
scripting = ["armatura-core/scripting"]
# Optional wgpu renderer (command render-gpu). Off by default so normal builds stay small and fast.
gpu = ["dep:armatura-gpu"]

[dev-dependencies]
# Only used by tests/e2e.rs to write and decode PNG files; already a dependency of armatura-core.
png = "0.18"
